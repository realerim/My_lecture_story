[project]
name = "lecture-note"
version = "0.1.0"
description = "Zoom 실시간 화면/음성을 감시해 교수님 강의 흐름대로 정리된 학습 노트를 만드는 프로그램"
requires-python = ">=3.10"

[project.scripts]
lecture-note = "lecture_note.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lecture_note*"]
